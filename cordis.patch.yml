# Your overlay on top of dsh-base (+ headless if you used --from-default-profile headless).
# Patch semantics: whole-row replace for `config`; use `disabled: true` to turn rows off.
#
# 1) Insert your plugins
# 2) Optionally disable base plugins you do not need (see BASE-PLUGINS.md)

# Optional: set deployment persona without a plugin (whole-config replace).
# - id: system-prompt
#   config:
#     personaPrefix: 'You are my custom agent.'

- insert:
    - id: hello-persona
      name: './plugins/hello-persona/index.js'

    - id: hello-tool
      name: './plugins/hello-tool/index.js'

